org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Network resilience for slow/unstable mirrors.
#
# `flutter build apk` failed twice with
#   > Could not download protos-32.1.0.jar ... Read timed out
# on this machine: transfers from the default repositories run at roughly
# 60-100 KB/s. Gradle's default socket timeout is too short for that, so it is
# raised and a retry policy is applied. google()/mavenCentral() are redirected
# to Aliyun mirrors by gradle/google-cdn.init.gradle.
org.gradle.internal.http.socketTimeout=180000
org.gradle.internal.http.connectionTimeout=180000
org.gradle.internal.repository.max.retries=8
org.gradle.internal.repository.initial.backoff=500

# Historical: this repo used to live at a non-ASCII path
# (E:\FirsryOS\Memory\一THREADRIPPER一\Furnace\app). On 2026-11-01 it
# was moved to the pure-ASCII path E:\Projects\Furnace, so the two
# workarounds below are no longer required. They are kept only as compatibility
# switches in case the checkout ever moves back to a non-ASCII path.
# (History) AGP refuses non-ASCII project paths by default:
#   "Your project path contains non-ASCII characters. ..."
android.overridePathCheck=true

# (History) The Kotlin compiler could not write incremental caches under the
# old non-ASCII path:
#   Could not close incremental caches in
#   ...\kotlin\compileDebugKotlin\cacheable\caches-jvm\...\*.tab
# Incremental compilation is a build-speed feature only, so it was switched off.
# With the ASCII path this can be re-enabled (set to true) if incremental
# Android builds are desired.
kotlin.incremental=false
kotlin.incremental.android=false
