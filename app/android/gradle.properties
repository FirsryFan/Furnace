org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Network resilience for slow/unstable mirrors.
#
# `flutter build apk` failed twice with
#   > Could not download protos-32.1.0.jar ... Read timed out
# on this machine: transfers from the default repositories run at roughly
# 60-100 KB/s. Gradle's default socket timeout is too short for that, so it is
# raised and a retry policy is applied. google()/mavenCentral() are redirected
# to Aliyun mirrors by gradle/google-cdn.init.gradle.
org.gradle.internal.http.socketTimeout=180000
org.gradle.internal.http.connectionTimeout=180000
org.gradle.internal.repository.max.retries=8
org.gradle.internal.repository.initial.backoff=500

# The workspace path contains non-ASCII characters
# (E:\FirsryOS\Memory\一THREADRIPPER一\class-productivity\app). The Android Gradle
# Plugin refuses to build in such a path by default:
#   "Your project path contains non-ASCII characters. This will most likely
#    cause the build to fail on Windows."
# The check exists because old AGP versions mishandled non-ASCII paths in
# packaging tasks. AGP told us the exact opt-out, and the build is verified by
# actually producing an APK, so it is enabled here. If native tooling ever fails
# on a non-ASCII path, moving the project to an ASCII path is the alternative.
android.overridePathCheck=true

# The Kotlin compiler could not write its incremental caches:
#   Could not close incremental caches in
#   ...\app\build\android_file_picker\kotlin\compileDebugKotlin\cacheable\caches-jvm\jvm\kotlin:
#   class-fq-name-to-source.tab, source-to-classes.tab, internal-name-to-source.tab
# This is very likely the non-ASCII path again (the workspace lives under
# E:\FirsryOS\Memory\一THREADRIPPER一\...). Incremental compilation is a
# build-speed feature only, so switching it off costs rebuild time, not
# correctness or a different artifact.
kotlin.incremental=false
kotlin.incremental.android=false
